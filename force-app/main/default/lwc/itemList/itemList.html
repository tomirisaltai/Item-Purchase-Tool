<template>
  <div class="slds-m-top_medium">

    <template if:true={loading}>
      <lightning-spinner alternative-text="Loading items"></lightning-spinner>
    </template>

    <template if:true={hasRows}>
      <lightning-datatable
          key-field="Id"
          data={items}
          columns={columns}
          hide-checkbox-column
          onrowaction={handleRowAction}>
      </lightning-datatable>

      <div class="slds-m-top_small slds-grid slds-grid_align-spread slds-align_absolute-center">
        <div>Showing {fromNum}-{toNum} of {total}</div>
        <div>
          <lightning-button label="Prev" onclick={handlePrev} disabled={disablePrev} class="slds-m-right_x-small"></lightning-button>
          <lightning-button label="Next" onclick={handleNext} disabled={disableNext}></lightning-button>
        </div>
      </div>
    </template>

    <template if:false={hasRows}>
      <div class="slds-text-color_weak slds-p-vertical_small">No items found.</div>
    </template>

    <!-- DETAILS MODAL -->
    <template if:true={isDetailsOpen}>
      <section role="dialog" class="slds-modal slds-fade-in-open" aria-modal="true">
        <div class="slds-modal__container">
          <header class="slds-modal__header">
            <h2 class="slds-text-heading_medium">{selected.Name}</h2>
          </header>

          <div class="slds-modal__content slds-p-around_medium">
            <template if:true={selected.Image__c}>
              <img src={selected.Image__c}
                   alt={selected.Name}
                   style="max-width:100%;max-height:240px;object-fit:cover;border-radius:8px;margin-bottom:12px;" />
            </template>

            <lightning-record-view-form record-id={selected.Id} object-api-name="Item__c">
              <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                  <lightning-output-field field-name="Family__c"></lightning-output-field>
                  <lightning-output-field field-name="Type__c"></lightning-output-field>
                  <lightning-output-field field-name="Price__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2">
                  <lightning-output-field field-name="Image__c"></lightning-output-field>
                </div>
              </div>
            </lightning-record-view-form>

            <div class="slds-m-top_medium slds-border_top slds-p-top_medium">
              <lightning-record-edit-form record-id={selected.Id} object-api-name="Item__c" onsuccess={handleEditSuccess}>
                <lightning-messages></lightning-messages>
                <div class="slds-grid slds-gutters">
                  <div class="slds-col slds-size_1-of-2">
                    <lightning-input-field field-name="Name"></lightning-input-field>
                    <lightning-input-field field-name="Family__c"></lightning-input-field>
                    <lightning-input-field field-name="Type__c"></lightning-input-field>
                  </div>
                  <div class="slds-col slds-size_1-of-2">
                    <lightning-input-field field-name="Price__c"></lightning-input-field>
                    <lightning-input-field field-name="Image__c"></lightning-input-field>
                  </div>
                </div>
                <div class="slds-m-top_medium slds-text-align_right">
                  <lightning-button variant="neutral" label="Close" onclick={closeDetails} class="slds-m-right_small"></lightning-button>
                  <lightning-button variant="brand" label="Save" type="submit"></lightning-button>
                </div>
              </lightning-record-edit-form>
            </div>
          </div>

        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

  </div>
</template>
